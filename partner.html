<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>提携先 売上報告フォーム</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root { --brand: #0f6e8c; --brand-soft: #e6f3f7; --text: #1f2a30; --muted: #5f6f78; --line: #d9e2e6; --bg: #f5f8f9; --danger: #c0392b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif; line-height: 1.7; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 60px; }
  .store { color: var(--brand); font-weight: 700; font-size: 14px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .lead { color: var(--muted); font-size: 14px; margin: 6px 0 18px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 20px 18px; margin-bottom: 16px; }
  .field { margin-bottom: 16px; }
  label, .flabel { display: block; font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  .req { background: var(--danger); color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 4px; margin-left: 6px; font-weight: 700; }
  .hint { font-size: 12px; color: var(--muted); font-weight: 400; }
  input, select, textarea { width: 100%; font-size: 16px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font-family: inherit; color: var(--text); }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand); border-color: var(--brand); }
  textarea { min-height: 80px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .error-msg { color: var(--danger); font-size: 13px; margin-top: 4px; display: none; }
  .field.invalid .error-msg { display: block; }
  .field.invalid input, .field.invalid select { border-color: var(--danger); }
  button { width: 100%; background: var(--brand); color: #fff; border: none; border-radius: 12px; font-size: 17px; font-weight: 800; padding: 15px; cursor: pointer; }
  button:disabled { opacity: .6; }
  .done { background: var(--brand-soft); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; display: none; }
  .demo { background: #fff4e5; border: 1px solid #f5c58a; color: #8a5300; border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; display: none; }
  @media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="store" id="storeName"></div>
  <h1>提携先 売上報告フォーム</h1>
  <p class="lead">作業が完了した案件を1件ずつ報告してください。報告内容は売上の集計と手数料の計算に使います。</p>

  <div class="demo" id="demoNotice">テストモードです（GASのURLが未設定のため、送信しても保存されません）。</div>
  <div class="done" id="done" role="status"></div>

  <form id="form" class="card" novalidate>
    <div class="field" data-req>
      <label for="code">連携コード<span class="req">必須</span> <span class="hint">事前にお伝えしたコード</span></label>
      <input type="password" id="code" autocomplete="off">
      <div class="error-msg">連携コードを入力してください</div>
    </div>
    <div class="grid2">
      <div class="field" data-req>
        <label for="workDate">作業日<span class="req">必須</span></label>
        <input type="date" id="workDate">
        <div class="error-msg">作業日を入力してください</div>
      </div>
      <div class="field" data-req>
        <label for="area">エリア<span class="req">必須</span></label>
        <select id="area"><option value="">選択してください</option></select>
        <div class="error-msg">エリアを選んでください</div>
      </div>
    </div>
    <div class="field" data-req>
      <label for="customer">お客様名<span class="req">必須</span> <span class="hint">姓のみでも可</span></label>
      <input type="text" id="customer">
      <div class="error-msg">お客様名を入力してください</div>
    </div>
    <div class="field" data-req>
      <label for="work">作業内容<span class="req">必須</span></label>
      <input type="text" id="work" placeholder="例）エアコンクリーニング（お掃除機能付き）＋室外機">
      <div class="error-msg">作業内容を入力してください</div>
    </div>
    <div class="grid2">
      <div class="field" data-req>
        <label for="units">台数<span class="req">必須</span></label>
        <input type="number" id="units" min="0" step="1" inputmode="numeric">
        <div class="error-msg">台数を入力してください</div>
      </div>
      <div class="field" data-req>
        <label for="amount">売上金額（税込・円）<span class="req">必須</span></label>
        <input type="number" id="amount" min="0" step="1" inputmode="numeric">
        <div class="error-msg">売上金額を入力してください</div>
      </div>
    </div>
    <div class="field">
      <label for="note">備考</label>
      <textarea id="note"></textarea>
    </div>
    <div style="position:absolute;left:-9999px" aria-hidden="true"><input type="text" id="website" tabindex="-1" autocomplete="off"></div>
    <button type="submit" id="submitBtn">報告する</button>
  </form>
</div>
<script src="config.js"></script>
<script>
(function () {
  var C = window.BOOKING_CONFIG;
  var $ = function (id) { return document.getElementById(id); };
  $('storeName').textContent = C.storeName;
  document.title = '提携先 売上報告フォーム｜' + C.storeName;
  if (!C.gasUrl) $('demoNotice').style.display = 'block';
  C.areas.forEach(function (a) { var o = document.createElement('option'); o.value = a; o.textContent = a; $('area').appendChild(o); });

  var form = $('form');
  form.addEventListener('input', function (e) { var f = e.target.closest('.field'); if (f) f.classList.remove('invalid'); });
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var ok = true;
    form.querySelectorAll('.field[data-req]').forEach(function (f) {
      var bad = !f.querySelector('input, select').value.trim();
      f.classList.toggle('invalid', bad); if (bad) ok = false;
    });
    if (!ok) return;
    var btn = $('submitBtn'); btn.disabled = true; btn.textContent = '送信しています…';
    var payload = {
      type: 'partner', code: $('code').value.trim(), workDate: $('workDate').value, area: $('area').value,
      customer: $('customer').value.trim(), work: $('work').value.trim(),
      units: Number($('units').value), amount: Number($('amount').value), note: $('note').value.trim(),
      website: $('website').value
    };
    var finish = function (msg) {
      $('done').innerHTML = msg; $('done').style.display = 'block';
      ['workDate', 'customer', 'work', 'units', 'amount', 'note'].forEach(function (id) { $(id).value = ''; });
      btn.disabled = false; btn.textContent = '報告する';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    if (!C.gasUrl) { setTimeout(function () { finish('テストモードのため保存はされていません。'); }, 500); return; }
    fetch(C.gasUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) throw new Error(d.error || '送信に失敗しました');
        finish('<strong>' + d.partner + '</strong> 様の報告を受け付けました（' + payload.customer + ' 様／' + Number(payload.amount).toLocaleString('ja-JP') + '円）。続けて次の案件を入力できます。');
      })
      .catch(function (err) { btn.disabled = false; btn.textContent = '報告する'; alert(err.message); });
  });
})();
</script>
</body>
</html>
